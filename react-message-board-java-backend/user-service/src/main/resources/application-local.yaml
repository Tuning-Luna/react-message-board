gb:
  db:
    host: 192.168.43.198
    # 修改为你自己的虚拟机IP地址
    pw: 123 # 修改为docker中的MySQL密码
    port: 3309
    database: guestbook_system
    un: root
spring:
  datasource:
    url: jdbc:mysql://${gb.db.host}:${gb.db.port}/${gb.db.database}?useUnicode=true&characterEncoding=utf8&autoReconnect=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${gb.db.un}
    password: ${gb.db.pw}

mybatis-plus:
  configuration:
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      update-strategy: not_null
      id-type: auto